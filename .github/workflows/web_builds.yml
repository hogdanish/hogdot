name: 🌐 Web Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    debug_symbols=no
    use_closure_compiler=yes
  # Upstream's pin, used by the vanilla (GLES3) web jobs. The WebGPU jobs
  # override it per-matrix: the fork's driver targets emdawnwebgpu's current
  # webgpu.h (4-parameter WGPUQueueWorkDoneCallback etc.) and is developed and
  # verified on emcc 6.0.x — the shipped CommonGrounds templates were built
  # with 6.0.8. Decision record: .claude/skills/build-export/SKILL.md.
  EM_VERSION: 4.0.11
  EM_VERSION_WEBGPU: 6.0.8
  # 6.0.8's clang fires -Wunused-template on upstream headers
  # (modules/gltf/gltf_template_convert.h) that upstream's 4.0.11 clang never
  # flags; under dev_mode's werror that fails only the webgpu jobs. Policy:
  # suppress, never patch upstream module code (pure rebase tax). emcc appends
  # EMCC_CFLAGS after every other flag — the only spot that beats the -Wall
  # SConstruct appends after custom ccflags/cxxflags — and only the webgpu
  # jobs import it (import_env_vars in their scons flags). If a SECOND
  # upstream warning class ever surfaces under emcc 6, flip these two jobs to
  # werror=no instead of growing this list.
  EMCC_CFLAGS: -Wno-unused-template

jobs:
  web-template:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Fork CI trim: the two WebGPU wasm32 jobs are what this fork ships;
        # the vanilla wasm32 job stays as a canary so fork changes cannot
        # silently break the default (GLES3) web config. wasm64 and the rest
        # of upstream's matrix are deliberately dropped (see runner.yml).
        include:
          - name: Template w/o threads, 32-bit (target=template_release, threads=no, arch=wasm32)
            cache-name: web-nothreads-template
            target: template_release
            scons-flags: threads=no arch=wasm32
            artifact: true

          - name: Template WebGPU, 32-bit (target=template_release, threads=no, arch=wasm32, webgpu=yes)
            cache-name: web-webgpu-template
            target: template_release
            scons-flags: threads=no arch=wasm32 webgpu=yes opengl3=no import_env_vars=EMCC_CFLAGS
            em-version-override: webgpu
            artifact: true

          - name: Template WebGPU debug, 32-bit (target=template_debug, threads=no, arch=wasm32, webgpu=yes)
            cache-name: web-webgpu-template-debug
            target: template_debug
            scons-flags: threads=no arch=wasm32 webgpu=yes opengl3=no import_env_vars=EMCC_CFLAGS
            em-version-override: webgpu
            artifact: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ matrix.em-version-override == 'webgpu' && env.EM_VERSION_WEBGPU || env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: web
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: matrix.artifact
        with:
          name: ${{ matrix.cache-name }}
