name: 🔗 GHA
# Fork CI is deliberately trimmed to what hogdot ships to CommonGrounds:
# static checks, the web templates (WebGPU + one vanilla canary), and the
# linuxbsd editor (the cg-release baker target). The android/ios/macos/windows
# platform workflows still exist in-tree but are not called — the game's
# desktop/server exports use official Godot. Rebase-forward note:
# .claude/skills/build-export/SKILL.md ("Fork CI").
# `branches` only: tag pushes (cg-v*) belong to cg_release.yml, not the matrix.
on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # First stage: Only static checks, fast and prevent expensive builds from running.

  static-checks:
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  # Second stage: Run all the builds and some of the tests.

  linux-build:
    name: 🐧 Linux
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/linux_builds.yml
    with:
      changed-files: ${{ needs.static-checks.outputs.changed-files }}

  web-build:
    name: 🌐 Web
    needs: static-checks
    if: needs.static-checks.outputs.sources-changed == 'true' || github.event_name != 'pull_request'
    uses: ./.github/workflows/web_builds.yml
