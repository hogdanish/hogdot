name: 🧪 WebGPU Tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [webgpu-4.6.2]
    paths:
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'
  pull_request:
    paths:
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    tests=no
    debug_symbols=no
  # The WebGPU driver targets the current emdawnwebgpu callback ABI and is
  # verified against this exact toolchain. Keep this in lockstep with the
  # WebGPU jobs in web_builds.yml and cg_release.yml; the downstream
  # pre-commit contract fails if one pin drifts.
  EM_VERSION_WEBGPU: 6.0.8
  # emcc 6.0.8 diagnoses an unused static function template in upstream code.
  # Import this only into the WebGPU build; see the build-export decision
  # record before changing or extending the suppression.
  EMCC_CFLAGS: -Wno-unused-template

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Shader Corpus: Standalone SPIR-V → WGSL validation (fast, no build needed)
  # ═══════════════════════════════════════════════════════════════════════════════
  shader-corpus:
    runs-on: ubuntu-24.04
    name: Shader Corpus (SPIR-V → WGSL)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Compile GLSL fixtures to SPIR-V
        working-directory: webgpu_tests/shader_corpus
        run: ./compile_fixtures.sh

      - name: Run SPIR-V → WGSL validation
        working-directory: webgpu_tests/shader_corpus
        run: node run_tests.mjs

      - name: Upload WGSL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shader-corpus-results
          path: webgpu_tests/shader_corpus/results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Driver Unit Tests: Algorithmic correctness of WebGPU driver subsystems
  # ═══════════════════════════════════════════════════════════════════════════════
  driver-unit-tests:
    runs-on: ubuntu-24.04
    name: Driver Unit Tests (JS)
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run driver unit tests
        working-directory: webgpu_tests/driver_unit_tests
        run: node run_tests.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Engine Build: Compile WebGPU export template + dump all SPIR-V
  # ═══════════════════════════════════════════════════════════════════════════════
  build-webgpu:
    runs-on: ubuntu-24.04
    name: Build WebGPU Template + Browser Scenes
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify WebGPU CI contracts
        run: python3 hogdot/check_webgpu_ci_contracts.py

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EM_VERSION_WEBGPU }}
          no-cache: true

      - name: Verify Emscripten setup
        run: emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Build WebGPU export template
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }} threads=no dlink_enabled=yes webgpu=yes
            opengl3=no import_env_vars=EMCC_CFLAGS use_closure_compiler=no
          platform: web
          target: template_release

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Restore editor sources removed by the template build
        run: git restore --source=HEAD --worktree -- editor

      - name: Build Linux editor (for export + SPIR-V dump)
        run: |
          scons platform=linuxbsd target=editor dev_mode=yes tests=no debug_symbols=no -j$(nproc)

      - name: Install scene smoketest browsers
        working-directory: webgpu_tests/scene_smoketest
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
          npm install
          npx playwright install chromium firefox --with-deps

      - name: Export and run tracked benchmark scenes (Chromium)
        working-directory: webgpu_tests/scene_smoketest
        run: >-
          xvfb-run --auto-servernum node run_scenes.mjs
          --export
          --browser chrome
          --scenes benchmark_sprites,benchmark_pbr,benchmark_instances,benchmark_particles,benchmark_animated,benchmark_postfx,benchmark_shadows,benchmark_batching
          --editor-bin ../../bin/godot.linuxbsd.editor.x86_64
          --template-zip ../../bin/godot.web.template_release.wasm32.nothreads.dlink.zip
          --timeout 180000

      - name: Run tracked benchmark scenes (Firefox)
        working-directory: webgpu_tests/scene_smoketest
        run: >-
          xvfb-run --auto-servernum node run_scenes.mjs
          --browser firefox
          --scenes benchmark_sprites,benchmark_pbr,benchmark_instances,benchmark_particles,benchmark_animated,benchmark_postfx,benchmark_shadows,benchmark_batching
          --timeout 180000

      - name: Export test project with SPIR-V dump
        run: |
          mkdir -p /tmp/spirv_dump
          mkdir -p webgpu_tests/test_project/export

          # The tracked preset validates both custom template paths even for a
          # release export. Alias the one dlink release template built above to
          # those paths; this avoids a base-version-specific install directory.
          install -m 0644 bin/godot.web.template_release.wasm32.nothreads.dlink.zip \
            bin/godot.web.template_debug.wasm32.nothreads.zip
          install -m 0644 bin/godot.web.template_release.wasm32.nothreads.dlink.zip \
            bin/godot.web.template_release.wasm32.nothreads.zip

          bin/godot.linuxbsd.editor.x86_64 \
            --headless --path webgpu_tests/test_project \
            --export-release "WebGPU" export/index.html

          # Shader compilation is lazy and --headless creates no renderer.
          # Run the coverage scene with Mobile under Xvfb to produce the dump.
          GODOT_DUMP_SPIRV=/tmp/spirv_dump timeout 120 \
            xvfb-run --auto-servernum bin/godot.linuxbsd.editor.x86_64 \
              --path webgpu_tests/test_project \
              --rendering-method mobile --quit-after 10

          echo "SPIR-V files dumped:"
          ls -la /tmp/spirv_dump/ | head -50
          shopt -s nullglob
          spirv_files=(/tmp/spirv_dump/*.spv)
          echo "Total: ${#spirv_files[@]} files"
          test -f webgpu_tests/test_project/export/index.html
          test "${#spirv_files[@]}" -gt 0

      - name: Upload SPIR-V dump
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spirv-dump
          path: /tmp/spirv_dump/
          retention-days: 7
          if-no-files-found: error

      - name: Upload WebGPU export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webgpu-export
          path: webgpu_tests/test_project/export/
          retention-days: 7
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════════
  # SPIR-V Validation: Validate ALL engine SPIR-V through Tint
  # ═══════════════════════════════════════════════════════════════════════════════
  validate-spirv:
    runs-on: ubuntu-24.04
    name: Validate Engine SPIR-V (Tint)
    needs: [build-webgpu]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download SPIR-V dump
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spirv-dump
          path: /tmp/spirv_dump/

      - name: Validate all SPIR-V through Tint
        run: |
          echo "Validating engine SPIR-V files through Tint..."
          node webgpu_tests/shader_corpus/validate_spirv_dump.mjs /tmp/spirv_dump/

  # ═══════════════════════════════════════════════════════════════════════════════
  # Smoke Test: Run exported project in headed Chrome under Xvfb
  # ═══════════════════════════════════════════════════════════════════════════════
  smoke-test:
    runs-on: ubuntu-24.04
    name: Chromium Smoke Test
    needs: [build-webgpu]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download WebGPU export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webgpu-export
          path: webgpu_tests/test_project/export/

      - name: Install Playwright
        run: |
          cd webgpu_tests/test_project
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run smoke test
        working-directory: webgpu_tests/test_project
        run: xvfb-run --auto-servernum node smoke_test.mjs ./export/

  # ═══════════════════════════════════════════════════════════════════════════════
  # Resource Lifecycle: Browser-based stress test
  # ═══════════════════════════════════════════════════════════════════════════════
  resource-lifecycle:
    runs-on: ubuntu-24.04
    name: Resource Lifecycle (Chrome WebGPU)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd webgpu_tests/resource_lifecycle
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run resource lifecycle stress tests
        working-directory: webgpu_tests/resource_lifecycle
        run: node run_tests.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Screenshot Comparison: Multi-browser visual regression
  # ═══════════════════════════════════════════════════════════════════════════════
  screenshot-comparison:
    runs-on: ubuntu-24.04
    name: Screenshot Comparison (Chrome + Firefox)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary
          cd webgpu_tests/screenshot_comparison
          npm init -y
          npm install playwright
          npx playwright install chromium firefox --with-deps

      - name: Run screenshot tests
        working-directory: webgpu_tests/screenshot_comparison
        run: xvfb-run --auto-servernum node screenshot_tests.mjs --update-baselines
        # First run creates baselines. On subsequent runs after baselines are committed,
        # change to: node screenshot_tests.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshot-comparison
          path: webgpu_tests/screenshot_comparison/screenshots/
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════════════════════
  test-summary:
    runs-on: ubuntu-24.04
    name: Test Summary
    needs: [shader-corpus, driver-unit-tests, build-webgpu, validate-spirv, smoke-test, resource-lifecycle, screenshot-comparison]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           WebGPU Test Suite Results                      ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Shader Corpus:        ${{ needs.shader-corpus.result }}"
          echo "  Driver Unit Tests:    ${{ needs.driver-unit-tests.result }}"
          echo "  Build + Browser Scenes: ${{ needs.build-webgpu.result }}"
          echo "  SPIR-V Validation:    ${{ needs.validate-spirv.result }}"
          echo "  Smoke Test:           ${{ needs.smoke-test.result }}"
          echo "  Resource Lifecycle:   ${{ needs.resource-lifecycle.result }}"
          echo "  Screenshot Compare:   ${{ needs.screenshot-comparison.result }}"
          echo ""

          FAILED=0

          if [ "${{ needs.shader-corpus.result }}" != "success" ]; then
            echo "::error::Shader corpus tests did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.driver-unit-tests.result }}" != "success" ]; then
            echo "::error::Driver unit tests did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.build-webgpu.result }}" != "success" ]; then
            echo "::error::WebGPU build and exported browser scenes did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.validate-spirv.result }}" != "success" ]; then
            echo "::error::Engine SPIR-V validation did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "::error::Chromium smoke test did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.resource-lifecycle.result }}" != "success" ]; then
            echo "::error::Resource lifecycle tests did not succeed"
            FAILED=1
          fi
          if [ "${{ needs.screenshot-comparison.result }}" != "success" ]; then
            echo "::error::Screenshot execution did not produce the complete Chromium + Firefox artifact"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
